- secret:
    name: oidc_secret
    oidc:
      ttl: 300
      algorithm: RS256
      claims:
        aud: sts.amazonaws.com
        my_claim: my_claim_value
        # Test it should not overwrite default claims
        sub: some_sub_value

- secret:
    name: oidc_secret_iss_overwrite_allowed
    oidc:
      ttl: 300
      algorithm: RS256
      iss: https://zuul.allowed.com
      claims:
        aud: sts.amazonaws.com
        my_claim: my_claim_value
        # Test it should not overwrite default claims
        sub: some_sub_value

- secret:
    name: oidc_secret_iss_overwrite_not_allowed
    oidc:
      ttl: 300
      algorithm: RS256
      iss: https://zuul.not-allowed.com
      claims:
        aud: sts.amazonaws.com
        my_claim: my_claim_value
        # Test it should not overwrite default claims
        sub: some_sub_value

- job:
    parent: base
    name: project2-oidc-secret
    run: playbooks/secret.yaml
    secrets:
      - oidc_secret
      - oidc_secret_iss_overwrite_allowed
      - oidc_secret_iss_overwrite_not_allowed

- project:
    check:
      jobs:
        - project2-oidc-secret
    gate:
      jobs:
        - noop
