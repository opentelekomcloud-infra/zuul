- pipeline:
    name: check
    manager: independent
    trigger:
      gerrit:
        - event: patchset-created
    success:
      gerrit:
        Verified: 1
    failure:
      gerrit:
        Verified: -1

- job:
    name: base-logs
    parent: null
    protected: true

- job:
    name: base-logs-test
    parent: null
    protected: true

- job:
    name: base
    parent: base-logs

- job:
    name: base-test
    parent: base-logs-test

- project:
    name: org/project
    check:
      jobs: []

- project:
    name: org/project1
    check:
      jobs: []
