- hosts: all
  tasks:
    - name: Print a 5x5 grid
      command:
        argv:
          - python3
          - -c
          - 'import sys;print(("x"*5+"\n")*5);print(("y"*5+"\n")*5,file=sys.stderr)'

    - name: Test that no_log correctly flushes input buffers
      no_log: true
      command:
        argv:
          - python3
          - -c
          - 'import sys;print(("x"*256+"\n")*512);print(("y"*256+"\n")*512,file=sys.stderr)'
      register: _run_command_result

    - assert:
        that:
          - _run_command_result is success
          - _run_command_result.rc == 0
          - not _run_command_result.stdout
          - not _run_command_result.stderr
