- pipeline:
    name: check
    manager: independent
    trigger:
      gerrit:
        - event: patchset-created
    success:
      gerrit:
        Verified: 1
    failure:
      gerrit:
        Verified: -1

- job:
    name: base
    parent: null
    run: playbooks/base.yaml

- job:
    name: no-semaphores
    run: playbooks/check.yaml

- job:
    name: one-semaphore
    run: playbooks/check.yaml
    semaphores: semaphore-1

- job:
    name: many-semaphores
    run: playbooks/check.yaml
    semaphores:
      - semaphore-1
      - semaphore-2

- semaphore:
    name: semaphore-1

- semaphore:
    name: semaphore-2

- project:
    name: org/project
    check:
      jobs:
        - no-semaphores
        - one-semaphore
        - many-semaphores
