- tenant:
    name: example-tenant
    source:
      gerrit:
        config-projects:
          - zuul-config:
              # During nodepool-in-zuul development, explicitly opt-in
              # to the experimental config objects.
              include:
                - pipeline
                - job
                - nodeset
                - secret
                - project
                - project-template
                - semaphore
                - queue
                - image
                - flavor
                - label
                - section
                - provider
        untrusted-projects:
          - test1
          - test2
      opendev.org:
        untrusted-projects:
          - zuul/zuul-jobs:
              include:
                - job
