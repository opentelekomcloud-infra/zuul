info:
  description: Incomplete (work in progress) list of the endpoints.
  title: Zuul REST API
  version: v1
openapi: 3.0.0
paths:
  /.well-known/jwks: {}
  /.well-known/openid-configuration: {}
  /api:
    get:
      operationId: index
      parameters: []
      responses:
        200:
          content:
            application/json:
              schema:
                properties:
                  authorizations:
                    type: string
                  builds:
                    type: string
                  buildsets:
                    type: string
                  components:
                    type: string
                  connections:
                    type: string
                  info:
                    type: string
                  jobs:
                    type: string
                  projects:
                    type: string
                  status:
                    type: string
                  tenant_info:
                    type: string
                  tenants:
                    type: string
                type: object
          description: Returns a map of available API endpoints
      summary: ''
      tags:
      - tenant
  /api/authorizations:
    get:
      operationId: root_authorizations
      parameters: []
      responses:
        200:
          content:
            application/json:
              schema:
                properties:
                  zuul.admin:
                    type: boolean
                type: object
          description: Returns authorization information for the authenticated user
      summary: ''
      tags:
      - tenant
  /api/components:
    get:
      operationId: components
      parameters: []
      responses:
        200:
          content:
            application/json:
              schema:
                items:
                  properties:
                    hostname:
                      type: string
                    last_seen:
                      type: string
                    name:
                      type: string
                    type:
                      type: string
                    version:
                      type: string
                  type: object
                type: array
          description: Returns the list of Zuul components and their status
      summary: ''
      tags:
      - tenant
  /api/connections:
    get:
      operationId: connections
      parameters: []
      responses:
        200:
          content:
            application/json:
              schema:
                items:
                  properties:
                    canonical_hostname:
                      type: string
                    driver:
                      type: string
                    name:
                      type: string
                    server:
                      type: string
                  type: object
                type: array
          description: Returns the list of configured connections
      summary: ''
      tags:
      - tenant
  /api/info:
    get:
      operationId: info
      parameters: []
      responses:
        200:
          content:
            application/json:
              schema:
                properties:
                  info:
                    properties:
                      capabilities:
                        properties:
                          auth:
                            properties:
                              auth_log_file_requests:
                                type: boolean
                              default_realm:
                                type: string
                              read_protected:
                                type: boolean
                            type: object
                          job_history:
                            type: boolean
                        type: object
                      stats:
                        properties:
                          last_reconfigured:
                            type: string
                          version:
                            type: string
                        type: object
                    type: object
                type: object
          description: Returns information about the Zuul instance
      summary: ''
      tags:
      - tenant
  /api/tenant/{tenant_name}/authorizations:
    get:
      operationId: tenant_authorizations
      parameters:
      - in: path
        name: tenant_name
        required: true
        schema:
          type: string
      responses:
        200:
          content:
            application/json:
              schema:
                properties:
                  zuul.admin:
                    type: boolean
                type: object
          description: Returns authorization information for the authenticated user
            in the tenant context
      summary: ''
      tags:
      - tenant
  /api/tenant/{tenant_name}/autohold:
    get:
      operationId: autohold_list
      parameters:
      - in: path
        name: tenant_name
        required: true
        schema:
          type: string
      responses:
        200:
          content:
            application/json:
              schema:
                items:
                  properties:
                    current_count:
                      type: integer
                    held_nodes:
                      items:
                        type: string
                      type: array
                    id:
                      type: string
                    job:
                      type: string
                    max_count:
                      type: integer
                    node_expiration:
                      type: string
                    nodes:
                      items:
                        type: string
                      type: array
                    project:
                      type: string
                    reason:
                      type: string
                    ref_filter:
                      type: string
                    tenant:
                      type: string
                  type: object
                type: array
          description: Returns the list of autohold requests for the tenant
        404:
          description: Tenant not found
      summary: ''
      tags:
      - tenant
  /api/tenant/{tenant_name}/autohold/{request_id}:
    delete:
      operationId: autohold_delete
      parameters:
      - in: path
        name: tenant_name
        required: true
        schema:
          type: string
      - in: path
        name: request_id
        required: true
        schema:
          type: string
      responses:
        200:
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                  success:
                    type: boolean
                type: object
          description: Deletes an autohold request
        404:
          description: Autohold request not found
      summary: ''
      tags:
      - tenant
    get:
      operationId: autohold_get
      parameters:
      - in: path
        name: tenant_name
        required: true
        schema:
          type: string
      - in: path
        name: request_id
        required: true
        schema:
          type: string
      responses:
        200:
          content:
            application/json:
              schema:
                properties:
                  current_count:
                    type: integer
                  held_nodes:
                    items:
                      type: string
                    type: array
                  id:
                    type: string
                  job:
                    type: string
                  max_count:
                    type: integer
                  node_expiration:
                    type: string
                  nodes:
                    items:
                      type: string
                    type: array
                  project:
                    type: string
                  reason:
                    type: string
                  ref_filter:
                    type: string
                  tenant:
                    type: string
                type: object
          description: Returns details of a specific autohold request
        404:
          description: Autohold request not found
      summary: ''
      tags:
      - tenant
  /api/tenant/{tenant_name}/badge:
    get:
      operationId: badge
      parameters:
      - description: The tenant name
        in: path
        name: tenant_name
        required: true
        schema:
          type: string
      - description: A project name
        in: query
        name: project
        schema:
          type: string
      - description: A pipeline name
        in: query
        name: pipeline
        schema:
          type: string
      - description: A branch name
        in: query
        name: branch
        schema:
          type: string
      responses:
        200:
          content:
            image/svg+xml:
              schema:
                type: object
          description: Badge describing the result of the latest buildset found.
        404:
          description: No buildset found
      summary: Get a badge describing the result of the latest buildset found.
      tags:
      - tenant
  /api/tenant/{tenant_name}/build-times:
    get:
      operationId: build_times
      parameters:
      - description: The name of the tenant
        in: path
        name: tenant_name
        required: true
        schema:
          type: string
      - description: Filter by project name
        in: query
        name: project
        schema:
          type: string
      - description: Filter by pipeline name
        in: query
        name: pipeline
        schema:
          type: string
      - description: Filter by branch name
        in: query
        name: branch
        schema:
          type: string
      - description: Filter by git ref
        in: query
        name: ref
        schema:
          type: string
      - description: Filter by job name
        in: query
        name: job_name
        schema:
          type: string
      - description: Filter by final status (true/false)
        in: query
        name: final
        schema:
          type: string
      - description: Filter builds after this timestamp
        in: query
        name: start_time
        schema:
          type: string
      - description: Filter builds before this timestamp
        in: query
        name: end_time
        schema:
          type: string
      - description: 'Maximum number of results to return (default: 50)'
        in: query
        name: limit
        schema:
          type: integer
      - description: 'Number of results to skip for pagination (default: 0)'
        in: query
        name: skip
        schema:
          type: integer
      - description: Result types to exclude from results
        in: query
        name: exclude_result
        schema:
          type: string
      responses:
        200:
          content:
            application/json:
              schema:
                items:
                  properties:
                    branch:
                      type: string
                    duration:
                      type: integer
                    end_time:
                      type: string
                    final:
                      type: boolean
                    job_name:
                      type: string
                    newrev:
                      type: string
                    pipeline:
                      type: string
                    project:
                      type: string
                    ref:
                      type: string
                    result:
                      type: string
                    start_time:
                      type: string
                    uuid:
                      type: string
                    voting:
                      type: boolean
                  type: object
                type: array
          description: Returns build timing information for analysis
        404:
          description: Tenant not found
      summary: Return build timing information for analysis. This endpoint provides
        build timing data that can be used for performance analysis and metrics collection.
        It supports filtering by various criteria.
      tags:
      - tenant
  /api/tenant/{tenant_name}/build/{uuid}:
    get:
      operationId: build
      parameters:
      - description: The name of the tenant
        in: path
        name: tenant_name
        required: true
        schema:
          type: string
      - description: The UUID of the build to retrieve
        in: path
        name: uuid
        required: true
        schema:
          type: string
      responses:
        200:
          content:
            application/json:
              schema:
                properties:
                  _id:
                    type: string
                  artifacts:
                    items:
                      properties:
                        metadata:
                          type: object
                        name:
                          type: string
                        url:
                          type: string
                      type: object
                    type: array
                  duration:
                    type: string
                  end_time:
                    type: string
                  error_detail:
                    type: string
                  final:
                    type: string
                  held:
                    type: string
                  job_name:
                    type: string
                  log_url:
                    type: string
                  nodeset:
                    type: string
                  provides:
                    items:
                      properties:
                        name:
                          type: string
                      type: object
                    type: array
                  ref:
                    description: The ref
                    properties:
                      branch:
                        type: string
                      change:
                        type: string
                      newrev:
                        type: string
                      oldrev:
                        type: string
                      patchset:
                        type: string
                      project:
                        type: string
                      ref:
                        type: string
                      ref_url:
                        type: string
                    type: object
                  result:
                    type: string
                  start_time:
                    type: string
                  uuid:
                    type: string
                  voting:
                    type: string
                type: object
          description: Returns details of a specific build
        404:
          description: Build not found
      summary: Get details of a specific build. This endpoint returns comprehensive
        information about a single build including its result, timing, artifacts,
        and associated buildset.
      tags:
      - tenant
  /api/tenant/{tenant_name}/builds:
    get:
      operationId: builds
      parameters:
      - description: The name of the tenant
        in: path
        name: tenant_name
        required: true
        schema:
          type: string
      - description: Filter by project name
        in: query
        name: project
        schema:
          type: string
      - description: Filter by pipeline name
        in: query
        name: pipeline
        schema:
          type: string
      - description: Filter by change number
        in: query
        name: change
        schema:
          type: string
      - description: Filter by branch name
        in: query
        name: branch
        schema:
          type: string
      - description: Filter by patchset number
        in: query
        name: patchset
        schema:
          type: string
      - description: Filter by git ref
        in: query
        name: ref
        schema:
          type: string
      - description: Filter by new revision
        in: query
        name: newrev
        schema:
          type: string
      - description: Filter by build UUID
        in: query
        name: uuid
        schema:
          type: string
      - description: Filter by job name
        in: query
        name: job_name
        schema:
          type: string
      - description: Filter by voting status (true/false)
        in: query
        name: voting
        schema:
          type: string
      - description: Filter by nodeset name
        in: query
        name: nodeset
        schema:
          type: string
      - description: Filter by build result
        in: query
        name: result
        schema:
          type: string
      - description: Filter by final status (true/false)
        in: query
        name: final
        schema:
          type: string
      - description: Filter by held status (true/false)
        in: query
        name: held
        schema:
          type: string
      - description: Filter by completion status (true/false)
        in: query
        name: complete
        schema:
          type: string
      - description: 'Maximum number of results to return (default: 50)'
        in: query
        name: limit
        schema:
          type: integer
      - description: 'Number of results to skip for pagination (default: 0)'
        in: query
        name: skip
        schema:
          type: integer
      - description: Minimum build index
        in: query
        name: idx_min
        schema:
          type: integer
      - description: Maximum build index
        in: query
        name: idx_max
        schema:
          type: integer
      - description: Result types to exclude from results
        in: query
        name: exclude_result
        schema:
          type: string
      responses:
        200:
          content:
            application/json:
              schema:
                items:
                  description: The build
                  properties:
                    _id:
                      type: string
                    artifacts:
                      items:
                        properties:
                          metadata:
                            type: object
                          name:
                            type: string
                          url:
                            type: string
                        type: object
                      type: array
                    duration:
                      type: string
                    end_time:
                      type: string
                    error_detail:
                      type: string
                    final:
                      type: string
                    held:
                      type: string
                    job_name:
                      type: string
                    log_url:
                      type: string
                    nodeset:
                      type: string
                    provides:
                      items:
                        properties:
                          name:
                            type: string
                        type: object
                      type: array
                    ref:
                      description: The ref
                      properties:
                        branch:
                          type: string
                        change:
                          type: string
                        newrev:
                          type: string
                        oldrev:
                          type: string
                        patchset:
                          type: string
                        project:
                          type: string
                        ref:
                          type: string
                        ref_url:
                          type: string
                      type: object
                    result:
                      type: string
                    start_time:
                      type: string
                    uuid:
                      type: string
                    voting:
                      type: string
                  type: object
                type: array
          description: Returns the list of builds
        404:
          description: Tenant not found
      summary: List the executed builds. This endpoint provides a list of executed
        builds with various filtering options for analysis and monitoring.
      tags:
      - tenant
  /api/tenant/{tenant_name}/buildset/{uuid}:
    get:
      operationId: buildset
      parameters:
      - in: path
        name: tenant_name
        required: true
        schema:
          type: string
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      responses:
        200:
          content:
            application/json:
              schema:
                properties:
                  _id:
                    type: string
                  builds:
                    items:
                      description: The build
                      properties:
                        _id:
                          type: string
                        artifacts:
                          items:
                            properties:
                              metadata:
                                type: object
                              name:
                                type: string
                              url:
                                type: string
                            type: object
                          type: array
                        duration:
                          type: string
                        end_time:
                          type: string
                        error_detail:
                          type: string
                        final:
                          type: string
                        held:
                          type: string
                        job_name:
                          type: string
                        log_url:
                          type: string
                        nodeset:
                          type: string
                        provides:
                          items:
                            properties:
                              name:
                                type: string
                            type: object
                          type: array
                        ref:
                          description: The ref
                          properties:
                            branch:
                              type: string
                            change:
                              type: string
                            newrev:
                              type: string
                            oldrev:
                              type: string
                            patchset:
                              type: string
                            project:
                              type: string
                            ref:
                              type: string
                            ref_url:
                              type: string
                          type: object
                        result:
                          type: string
                        start_time:
                          type: string
                        uuid:
                          type: string
                        voting:
                          type: string
                      type: object
                    type: array
                  event_id:
                    type: string
                  event_timestamp:
                    type: string
                  events:
                    items:
                      description: The buildset event
                      properties:
                        description:
                          type: string
                        event_time:
                          type: string
                        event_type:
                          type: string
                      type: object
                    type: array
                  first_build_start_time:
                    type: string
                  last_build_end_time:
                    type: string
                  message:
                    type: string
                  pipeline:
                    type: string
                  refs:
                    items:
                      description: The ref
                      properties:
                        branch:
                          type: string
                        change:
                          type: string
                        newrev:
                          type: string
                        oldrev:
                          type: string
                        patchset:
                          type: string
                        project:
                          type: string
                        ref:
                          type: string
                        ref_url:
                          type: string
                      type: object
                    type: array
                  result:
                    type: string
                  uuid:
                    type: string
                type: object
          description: Returns a buildset
        404:
          description: Tenant not found
      summary: ''
      tags:
      - tenant
  /api/tenant/{tenant_name}/buildsets:
    get:
      operationId: buildsets
      parameters:
      - description: The name of the tenant
        in: path
        name: tenant_name
        required: true
        schema:
          type: string
      - description: Filter by project name
        in: query
        name: project
        schema:
          type: string
      - description: Filter by pipeline name
        in: query
        name: pipeline
        schema:
          type: string
      - description: Filter by change number
        in: query
        name: change
        schema:
          type: string
      - description: Filter by branch name
        in: query
        name: branch
        schema:
          type: string
      - description: Filter by patchset number
        in: query
        name: patchset
        schema:
          type: string
      - description: Filter by git ref
        in: query
        name: ref
        schema:
          type: string
      - description: Filter by new revision
        in: query
        name: newrev
        schema:
          type: string
      - description: Filter by buildset UUID
        in: query
        name: uuid
        schema:
          type: string
      - description: Filter by buildset result
        in: query
        name: result
        schema:
          type: string
      - description: Filter by completion status (true/false)
        in: query
        name: complete
        schema:
          type: string
      - description: 'Maximum number of results to return (default: 50)'
        in: query
        name: limit
        schema:
          type: integer
      - description: 'Number of results to skip for pagination (default: 0)'
        in: query
        name: skip
        schema:
          type: integer
      - description: Minimum buildset index
        in: query
        name: idx_min
        schema:
          type: integer
      - description: Maximum buildset index
        in: query
        name: idx_max
        schema:
          type: integer
      - description: Result types to exclude from results
        in: query
        name: exclude_result
        schema:
          type: string
      responses:
        200:
          content:
            application/json:
              schema:
                items:
                  description: The buildset
                  properties:
                    _id:
                      type: string
                    event_id:
                      type: string
                    event_timestamp:
                      type: string
                    first_build_start_time:
                      type: string
                    last_build_end_time:
                      type: string
                    message:
                      type: string
                    pipeline:
                      type: string
                    refs:
                      items:
                        description: The ref
                        properties:
                          branch:
                            type: string
                          change:
                            type: string
                          newrev:
                            type: string
                          oldrev:
                            type: string
                          patchset:
                            type: string
                          project:
                            type: string
                          ref:
                            type: string
                          ref_url:
                            type: string
                        type: object
                      type: array
                    result:
                      type: string
                    uuid:
                      type: string
                  type: object
                type: array
          description: Returns the list of buildsets
        404:
          description: Tenant not found
      summary: List the executed buildsets. This endpoint provides a list of executed
        buildsets with various filtering options for analysis and monitoring.
      tags:
      - tenant
  /api/tenant/{tenant_name}/config-errors:
    get:
      operationId: config_errors
      parameters:
      - description: The name of the tenant
        in: path
        name: tenant_name
        required: true
        schema:
          type: string
      - description: Filter errors by project name
        in: query
        name: project
        schema:
          type: string
      - description: Filter errors by branch name
        in: query
        name: branch
        schema:
          type: string
      - description: Filter errors by severity level
        in: query
        name: severity
        schema:
          type: string
      - description: Filter errors by error name
        in: query
        name: name
        schema:
          type: string
      - description: 'Maximum number of errors to return (default: 50)'
        in: query
        name: limit
        schema:
          type: integer
      - description: 'Number of errors to skip for pagination (default: 0)'
        in: query
        name: skip
        schema:
          type: integer
      responses:
        200:
          content:
            application/json:
              schema:
                items:
                  properties:
                    error:
                      type: string
                    name:
                      type: string
                    severity:
                      type: string
                    short_error:
                      type: string
                    source_context:
                      properties:
                        branch:
                          type: string
                        path:
                          type: string
                        project_name:
                          type: string
                        trusted:
                          type: boolean
                      type: object
                  type: object
                type: array
          description: Returns configuration errors for the tenant
        404:
          description: Tenant not found
      summary: Return configuration errors for the tenant. This endpoint provides
        a list of configuration errors encountered during tenant configuration loading,
        with optional filtering capabilities.
      tags:
      - tenant
  /api/tenant/{tenant_name}/console-stream:
    get:
      operationId: console_stream_get
      parameters:
      - description: 'The name of the tenant Note: Authentication is handled within
          the WebSocket protocol itself, not via HTTP headers, as headers are not
          included during the WebSocket upgrade.'
        in: path
        name: tenant_name
        required: true
        schema:
          type: string
      responses:
        101:
          content:
            text/plain:
              schema:
                type: string
          description: WebSocket connection established for streaming console logs
        400:
          description: Invalid WebSocket request
        404:
          description: Tenant not found
      summary: Establish WebSocket connection for streaming console logs. This endpoint
        upgrades the HTTP connection to a WebSocket for real-time streaming of console
        logs from builds. The WebSocket protocol is used to provide live log streaming
        capabilities to clients.
      tags:
      - tenant
  /api/tenant/{tenant_name}/flavors:
    get:
      operationId: flavors
      parameters:
      - in: path
        name: tenant_name
        required: true
        schema:
          type: string
      responses:
        200:
          content:
            application/json:
              schema:
                items:
                  description: The image
                  properties:
                    canonical_name:
                      type: string
                    description:
                      type: string
                    name:
                      type: string
                  type: object
                type: array
          description: Returns the list of flavors
        404:
          description: Tenant not found
      summary: ''
      tags:
      - tenant
  /api/tenant/{tenant_name}/image-build-artifact/{artifact_id}:
    delete:
      operationId: image_build_artifact_delete
      parameters:
      - description: The name of the tenant
        in: path
        name: tenant_name
        required: true
        schema:
          type: string
      - description: The ID of the artifact to delete
        in: path
        name: artifact_id
        required: true
        schema:
          type: string
      responses:
        204:
          description: Image build artifact deletion initiated successfully
        404:
          description: Image build artifact not found in tenant
      summary: Delete an image build artifact. This endpoint marks an image build
        artifact for deletion. The artifact must belong to the specified tenant.
      tags:
      - tenant
  /api/tenant/{tenant_name}/image-upload/{upload_id}:
    delete:
      operationId: image_upload_delete
      parameters:
      - description: The name of the tenant
        in: path
        name: tenant_name
        required: true
        schema:
          type: string
